# Lista de tareas de AdaptiveBingo. Cada archivo .yml de esta carpeta es una lista y cards.yml dice
# cuántas tareas salen de cada una. Después de editar, /bingo reload (la partida en curso no cambia).
#
#   lista:  nombre de la lista (si falta, el del archivo)
#   tier:   dificultad, de S (la más difícil) a D (la más fácil)
#   tareas: una por línea. Todas llevan `nombre` (lo que se lee en el juego) y pueden llevar
#     icono: el ítem que se dibuja en la casilla en vez del de por defecto
#     id:    por defecto <tipo>:<qué>; solo hace falta si la misma cosa va dos veces
#   y según el `tipo` (si falta, item):
#     item (tener en el inventario)    item: oak_log, cantidad: cuántos a la vez (si falta, 1)
#     matar (o kill)                   mob: zombie, cantidad (si falta, 1); ícono: el huevo del mob
#     logro (o advancement)            logro: story/mine_diamond; ícono: el del logro. Al empezar la
#                                      partida se le quitan a cada jugador los logros de su cartilla
#     estadistica (o statistic)        estadistica: jump, cantidad: cuánto desde que empezó la partida;
#                                      las de bloque, ítem o mob llevan `de` (mine_block, de: stone)
#     alguno (o any_of)                de: [ítems], necesita: cuántos distintos a la vez (si falta, 1)
#     todos (o all_of)                 de: [ítems]: todos a la vez
#                                      (en los dos, `cantidad` es de cada ítem; si falta, 1)
#   condiciones (cualquier tipo): la tarea solo avanza si se cumplen todas en ese momento
#     dimension: overworld, nether o end (o una lista)    hora: dia o noche
#     bioma: desert (o una lista)    debajo_de_y: 0    sin_morir: true (sin morir desde que empezó)
#     alguna: [ { bioma: desert }, { hora: noche } ]   (alcanza con una de la lista)
#   Ej.: { item: cooked_porkchop, nombre: Chuleta en el Nether, condiciones: [ { dimension: nether } ] }
#   Las estadísticas miran las condiciones al leerse (cada segundo), no en cada salto.
#   Nombres de ítems, mobs, logros y estadísticas: https://minecraft.wiki/w/Java_Edition_data_values
#   (oak_log y minecraft:oak_log son lo mismo). Las estadísticas usan los nombres de Bukkit:
#   https://jd.papermc.io/paper/1.21.11/org/bukkit/Statistic.html (en minúsculas).
