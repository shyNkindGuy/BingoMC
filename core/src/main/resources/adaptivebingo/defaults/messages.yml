  anuncio: "{equipo} &7completó &f{tarea} &7({casillas}/{total})"
  lockout: "&7[Lockout] {equipo} &7se quedó con &f{tarea}"
  logros_reiniciados: "&7Se reiniciaron {cantidad} logros de tu cartilla para que cuenten en esta partida."

recarga:
  ok: "&aTareas recargadas."
  linea: "&7{linea}"
