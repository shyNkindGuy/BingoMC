# Textos de AdaptiveBingo. Colores con & (&a verde, &c rojo, &e amarillo, &6 dorado, &7 gris, &f blanco,
# &l negrita, &r normal…). Lo que va entre llaves ({jugador}) lo pone el plugin. Si borras una línea, vuelve
# la de por defecto. Después de editar, /bingo reload.

comando:
  uso: "&eUso: /bingo <start [cartilla] [semilla]|stop|pause|map|card|stats [jugador]|reload|team>"
  sin_permiso_iniciar: "&cNo tienes permiso para iniciar el Bingo."
  sin_permiso_detener: "&cNo tienes permiso para detener el Bingo."
  sin_permiso_recargar: "&cNo tienes permiso para recargar el Bingo."
  sin_permiso_pausar: "&cNo tienes permiso para pausar el Bingo."
  sin_permiso_equipos: "&cNo tienes permiso para armar los equipos."
  solo_jugador: "&cEsto lo puede hacer solo un jugador."

inicio:
  ya_en_curso: "&cEl Bingo ya está en curso."
  sin_jugadores: "&cNo hay jugadores conectados."
  cartilla_no_existe: "&cNo existe la cartilla &f{cartilla}&c. Hay: &f{cartillas}"
  error: "&c{error}"
  modo_imposible: "&cEl modo {modo} no se puede con la cartilla {cartilla}: {problema}. Cámbialo en config.yml."
  no_se_pudo: "&cNo se pudo empezar la partida."
  anuncio: "&a&lBINGO INICIADO!"
  detalle: "&7Cartilla &f{cartilla} &7({lado}×{lado}) · semilla &f{semilla} &7· gana: &f{modo} &7· {duracion}{pvp}"
  minutos: "{minutos} min"
  sin_limite: "sin límite"
  sin_pvp: " · sin PvP"

cuenta:
  titulo: "&e{segundos}"
  subtitulo: "&7El bingo empieza en…"
  ya_titulo: "&a¡YA!"
  ya_subtitulo: "&7Gana: {modo}"
  a_jugar: "&a&l¡A JUGAR!"

partida:
  bingo: "&6&lBINGO!"
  ganador: "{ganador} &ese los papeó :v"
  tiempo: "&7Tiempo: &f{tiempo}"
  detenida: "&c&lBINGO DETENIDO &7por {quien}"
  no_hay: "&cNo hay ninguna partida en curso."
  entraste: "&aEntraste a la partida de bingo en curso: tu cartilla está en la mano izquierda."

pausa:
  titulo: "&f⏸ PAUSA"
  sigue_titulo: "&a▶ ¡SIGUE!"
  subtitulo: "&7por {quien}"
  pausada: "&f⏸ Partida en pausa &7por {quien}: el tiempo no corre y nadie se mueve. &f/bingo pause &7para seguir."
  sigue: "&a▶ Sigue la partida &7({quien})"
  no_se_puede: "&cSolo se puede pausar una partida en curso."

resumen:
  titulo: "&6&l— Resumen —"
  equipo: "{equipo}&7: &f{casillas} casillas"
  # las de los ganadores, una por una
  casilla: "&8  {tiempo} &f{tarea} &7· {jugador}"
  mvp: "&6MVP: &f{jugador} &7({casillas} casillas)"

fin:
  aviso_volver: "&7En {segundos} s vuelven todos a donde empezaron."
  aviso_limpiar: "&7En {segundos} s se vacían los inventarios de quienes jugaron."

puntos:
