name: Build

# Compila los dos módulos (core y plugin) y corre sus tests en cada PR y en cada push a master.
# El .jar del plugin queda como artefacto del run: se descarga y se copia a plugins/ del servidor Paper.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y correr tests
        run: mvn -B -ntp verify

      - name: Verificar el jar del plugin
        # El pom filtra ${project.version}; si queda sin reemplazar, Paper carga el plugin con versión basura.
        # Y el jar tiene que llevar adentro las clases de core (maven-shade-plugin) y sus YAML por defecto,
        # o el plugin no arranca.
        run: |
          unzip -p plugin/target/AdaptiveBingo-*.jar plugin.yml | tee plugin.yml.out
          grep -Eq "^version: '[0-9]+\.[0-9]+\.[0-9]+'$" plugin.yml.out
          unzip -l plugin/target/AdaptiveBingo-*.jar > jar.txt
          grep -q 'com/shyNkindguy/bingo/core/card/BingoCard.class' jar.txt
          grep -q 'adaptivebingo/defaults/cards.yml' jar.txt
          grep -q 'adaptivebingo/defaults/tasks/basicos.yml' jar.txt

      - name: Subir jar
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-bingo-jar
          path: plugin/target/AdaptiveBingo-*.jar
          if-no-files-found: error
          retention-days: 14
